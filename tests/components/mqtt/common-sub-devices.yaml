# Entities with the same name on different sub-devices: with sub_device_topics each
# gets its own topics and discovery ids (<topic_prefix>/<sub_device>/sensor/<name>/...).
esphome:
  devices:
    - id: pack_1
      name: Pack 1
    - id: pack_2
      name: Pack 2

mqtt:
  sub_device_topics: true

sensor:
  - platform: template
    name: Battery SoC
    lambda: return 64.0;
  - platform: template
    name: Battery SoC
    device_id: pack_1
    lambda: return 55.0;
  - platform: template
    name: Battery SoC
    device_id: pack_2
    lambda: return 74.0;

switch:
  - platform: template
    name: Charge enabled
    device_id: pack_1
    optimistic: true
  - platform: template
    name: Charge enabled
    device_id: pack_2
    optimistic: true
